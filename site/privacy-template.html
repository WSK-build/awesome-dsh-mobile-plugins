<!doctype html>
<!-- 隐私页模板。:root 的变量取值与 site/template.html 保持一致。各语言正文存放在
     site/privacy.<code>.html，由 site/locales.mjs 引用。 -->
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<link rel="canonical" href="__URL__">
__HREFLANGS__
<meta property="og:type" content="website">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESC__">
<meta property="og:url" content="__URL__">
<meta property="og:image" content="__OG_IMAGE__">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F0ECE2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B241F">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="__T_BASE__logo.svg" type="image/svg+xml">
<style>
/* ── 视觉 token：取值与 site/template.html 的 :root 一致 ── */
:root{
  /* 纸墨（取自本项目 logo Paper & Ink）+ 印章绿（与 DSHBox 宿主 UI 主色一致） */
  --paper:#F0ECE2; --paper-2:#E8E3D6; --card:#FBF9F3; --line:#DCD5C6; --line-2:#C8BFAC;
  --ink:#24312B; --ink-2:#5A655D; --ink-3:#626A63;
  --seal:#0D7359; --seal-deep:#0A5A46; --seal-soft:#DFEBE4; --seal-border:#BFDACD;
  --on-seal:#ffffff;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","Cascadia Mono",Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1B241F; --paper-2:#222C26; --card:#252F29; --line:#33403A; --line-2:#44534B;
    --ink:#E7EBE7; --ink-2:#A8B2AC; --ink-3:#8F9993;
    --seal:#3FA98A; --seal-deep:#5CC0A2; --seal-soft:rgba(63,169,138,.14); --seal-border:rgba(63,169,138,.36);
    --on-seal:#211d18;
  }
}
*{margin:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--seal);text-underline-offset:.15em}
a:hover{color:var(--seal-deep)}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.3rem}
header{border-bottom:1px solid var(--line);padding-block:1rem}
header .row{display:flex;align-items:center;gap:1rem;max-width:46rem;margin:0 auto;padding:0 1.3rem}
.logo{display:flex;align-items:center;gap:.55rem;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.logo img{width:22px;height:22px}
header .grow{flex:1}
.lang-btn{font-size:.82rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:.22rem .6rem}
.lang-btn:hover{border-color:var(--seal-border);color:var(--seal)}
main{padding-block:2.6rem 1rem}
h1{font-family:var(--display);font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:800;letter-spacing:-.025em;line-height:1.15}
.updated{color:var(--ink-3);font-size:.86rem;margin-top:.7rem}
.prose h2{font-family:var(--display);font-size:1.12rem;font-weight:700;letter-spacing:-.01em;margin:2.2rem 0 .5rem;padding-top:.9rem;border-top:1px solid var(--line)}
.prose h3{font-size:.98rem;font-weight:650;margin:1.5rem 0 .3rem}
.prose p,.prose li{color:var(--ink-2);margin:.55rem 0}
.prose ul{padding-left:1.15rem}
.prose strong{color:var(--ink);font-weight:650}
.prose code{font-family:var(--mono);background:var(--seal-soft);border:1px solid var(--seal-border);border-radius:5px;padding:.06em .34em;font-size:.86em;color:var(--ink)}
.prose table{width:100%;border-collapse:collapse;margin:.9rem 0;font-size:.92rem}
.prose th,.prose td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.prose th{color:var(--ink);font-weight:650}
footer{border-top:1px solid var(--line);margin-top:2.6rem;padding-block:1.6rem 2.6rem;color:var(--ink-3);font-size:.8rem}
footer .frow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem 1.5rem}
footer a{color:var(--ink-2)}
footer a:hover{color:var(--seal)}
</style>
</head>
<body>
<header><div class="row">
  <a class="logo" href="__HOME__"><img src="__T_BASE__logo.svg" alt="" width="22" height="22"><span translate="no">awesome-dsh-mobile-plugins</span></a>
  <span class="grow"></span>
  __LOCALE_LINKS__
</div></header>

<main class="wrap prose">
__PRIVACY_BODY__
</main>

<footer><div class="wrap frow">
  <span>© 2026 awesome-dsh-mobile-plugins · <a href="https://github.com/WSK-build/awesome-dsh-mobile-plugins" rel="noopener">GitHub</a> · __T_NOTAFF__</span>
  <span><a href="__HOME__">__T_BACKHOME__</a></span>
</div></footer>
</body>
</html>
