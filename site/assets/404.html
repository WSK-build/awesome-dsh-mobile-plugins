<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — awesome-dsh-mobile-plugins</title>
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F0ECE2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B241F">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/awesome-dsh-mobile-plugins/logo.svg" type="image/svg+xml">
<style>
/* ── 视觉 token：取值与 site/template.html 的 :root 一致 ── */
:root{
  /* 纸墨（取自本项目 logo Paper & Ink）+ 印章绿（与 DSHBox 宿主 UI 主色一致） */
  --paper:#F0ECE2; --paper-2:#E8E3D6; --card:#FBF9F3; --line:#DCD5C6; --line-2:#C8BFAC;
  --ink:#24312B; --ink-2:#5A655D; --ink-3:#626A63;
  --seal:#0D7359; --seal-deep:#0A5A46; --seal-soft:#DFEBE4; --seal-border:#BFDACD;
  --on-seal:#ffffff;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","Cascadia Mono",Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1B241F; --paper-2:#222C26; --card:#252F29; --line:#33403A; --line-2:#44534B;
    --ink:#E7EBE7; --ink-2:#A8B2AC; --ink-3:#8F9993;
    --seal:#3FA98A; --seal-deep:#5CC0A2; --seal-soft:rgba(63,169,138,.14); --seal-border:rgba(63,169,138,.36);
    --on-seal:#211d18;
  }
}
*{margin:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:var(--paper);color:var(--ink);
  min-height:100vh;display:grid;place-items:center;padding:2rem;
}
main{text-align:center;max-width:32rem}
.no{font-family:var(--mono);font-size:.85rem;color:var(--seal);letter-spacing:.15em}
h1{font-weight:900;font-size:clamp(4rem,15vw,7rem);line-height:1;letter-spacing:-.02em;margin:.2em 0 .3em}
h1 em{font-style:normal;color:var(--seal)}
p{color:var(--ink-2);line-height:1.7}
.links{margin-top:1.6rem;display:flex;gap:1.4rem;justify-content:center;font-family:var(--mono);font-size:.85rem}
a{color:var(--seal)}
</style>
</head>
<body>
<main>
  <div class="no">№ 404 · PART NOT FOUND</div>
  <h1>4<em>0</em>4</h1>
  <p>This part isn't in the catalog. / 目录里没有这个零件。</p>
  <div class="links">
    <a href="/awesome-dsh-mobile-plugins/">← Back to the list</a>
    <a href="/awesome-dsh-mobile-plugins/zh/">← 返回列表</a>
  </div>
</main>
</body>
</html>
