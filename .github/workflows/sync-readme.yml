name: Sync READMEs from data/plugins

# The READMEs are a generated artifact that happens to live in the repository,
# because an awesome list has to BE a README. Requiring every contributor to
# commit their own regeneration is what made the queue unmergeable: two
# unrelated submissions in the same category touch the same generated lines, so
# merging either one puts the other into conflict. On 2026-08-30 that was 218 of
# 296 open pull requests — none of them in conflict over anything a human wrote.
#
# 所以生成移到本工作流。PR 只携带 data/plugins/*.yml；本工作流检出 main 的最新
# tip，在其上重新生成 README，有差异时把提交推到分支 chore/readme-<run id>，
# 再用 REST 创建指向 main 的 pull request。贡献者仍可以自行提交重生成结果，
# pr-check 两种形态都接受。
#
# 终止条件：PR 合并进 main 后再次触发本工作流，第二次运行重新生成后无差异，
# 直接退出。bot 守卫让第二次运行代价低，正确性来自 generate-readme.mjs 的确定性。
#
# 事实：默认 GITHUB_TOKEN 无法调用 GraphQL 的 createPullRequest（返回
# Resource not accessible by integration），REST
# POST /repos/{owner}/{repo}/pulls 可以成功，因此工作流内建 PR 一律走 REST。
#
# 事实：默认 GITHUB_TOKEN 不能推送任何触碰 .github/workflows/** 的提交；本工作流
# 只提交 README.md 与 README.zh.md。
#
# 事实：默认 GITHUB_TOKEN 创建的 PR 不会触发 pull_request 相关工作流（GitHub
# 抑制递归），因此该 PR 上不会出现 check 之类的检查，合并由人工把关。

on:
  push:
    branches: [main]
    paths:
      - 'data/plugins/**'
      - 'scripts/generate-readme.mjs'
      - 'scripts/lib/**'
      - 'site/locales.mjs'

# Unlike build-site.yml, this one DOES write to the repository — that is its
# entire job. Kept as its own workflow with its own narrow permission rather
# than relaxing the build, so "the build never writes to the repository" stays
# true where it matters.
#
# contents: write 用于推送生成分支；pull-requests: write 用于通过 REST 在本仓库
# 创建 pull request。
permissions:
  contents: write
  pull-requests: write

# 同一时间只允许一个运行：两者会重生成同一个文件，第二个创建的 PR 与第一个
# 内容重复。排队而不取消——取消会让 main 的 README 一直过期，直到下一次合并
# 恰好修复它。
#
# 排队还不够：排队中的运行仍持有触发时检出的 sha，轮到它时该 sha 已是 main 的
# 祖先而非 tip。因此每次运行开始时先 fetch 并 reset 到 origin/main，再基于该
# tip 生成分支与 PR；这个组只负责让两个运行不互相抢占。
concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      # 检出 main 的 tip，而非触发时的 commit：并发组只串行化运行，不会移动
      # 已检出的 sha。生成必须基于 main 的最新 tip，PR 的 diff 才只包含本次
      # 重生成的结果。
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Regenerate and open a pull request
        # gh 通过环境变量 GITHUB_TOKEN 认证；REST 建 PR 需要 pull-requests: write。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 生成基于 main 的最新 tip。generate-readme.mjs 是确定性的且只读
          # data/plugins，因此在 tip 上直接生成一次即可，不需要重试循环。
          git fetch origin main --quiet
          git reset --hard origin/main --quiet
          node scripts/generate-readme.mjs

          if git diff --quiet -- README.md README.zh.md; then
            echo "READMEs already match data/plugins — nothing to do."
            exit 0
          fi

          branch="chore/readme-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add README.md README.zh.md
          # The added-date for a new entry derives from the commit that first
          # added its line to the default-locale README (build-site.mjs), which
          # is now this commit rather than the merge. Same day, seconds apart —
          # but say so here, because the next person to read that derivation
          # will wonder why every recent date points at a bot commit.
          git commit -m 'chore: regenerate READMEs from data/plugins'
          # 本次提交只包含 README.md 与 README.zh.md，不触碰 .github/workflows/**。
          git push -u origin "$branch"

          # 建 PR 走 REST：默认 GITHUB_TOKEN 调用 GraphQL 的 createPullRequest
          # 返回 Resource not accessible by integration，REST
          # POST /repos/{owner}/{repo}/pulls 可以成功。该 PR 由 GITHUB_TOKEN
          # 创建，不会触发 pull_request 工作流，因此不会出现 check，需人工合并。
          gh api -i --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="chore: regenerate READMEs from data/plugins" \
            -f head="$branch" \
            -f base=main \
            -f body="由 data/plugins 重生成的 README，内容来自 data/plugins。该 PR 由 GITHUB_TOKEN 创建，不会自动触发检查，需人工合并。"
