name: Sync upstream code (no data)

# 定点搬运上游的**代码 / 站点 / 脚本**更新，永不搬它的数据：
#   - 只按 tools/ours.config.json 里的 syncPaths 取文件；
#   - data/、README*.md 不在列表里，所以它的条目与探测数据进不来；
#   - 归我们所有的文件（oursOwned）取件后用 git checkout HEAD -- 还原；
#   - 再用 tools/apply-ours.mjs 重新打我们的补丁（身份串 + wsl→phone 分类 + 文本补丁），
#     否则仓库名/域名/npm 包名会被改回它的、我们的分类会被还原；
#   - 跑一遍自检（单测 + README 生成 + 站点构建）当门禁；
#   - 自检会重写 README，进 PR 前先把 README 还原成我们的版本；
#   - .github/workflows/** 的改动**不进提交**：默认 GITHUB_TOKEN 无权推送工作流文件
#     （GitHub 不向它开放 workflows 权限），这些改动只在 PR 正文里列出、由人工在本机合并；
#   - 最后**开 PR**，由人看过再合（要直推 main 就把最后一步的 gh pr create 换掉）。
on:
  schedule:
    - cron: "40 3 * * 1"   # 每周一 03:40
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/awesome-dsh-plugin/awesome-dsh-plugin.git
          git fetch --depth 1 upstream main
      - name: Take upstream's code paths only
        run: |
          # 上游可能没有 syncPaths 里的某个路径（例如将来改名/删掉某个目录），
          # 不存在的 pathspec 会让 checkout 整体失败；先过滤，只提交在 FETCH_HEAD
          # 里确实存在的路径。
          paths="$(node tools/apply-ours.mjs --print-sync-paths)" \
            || { echo "❌ 读取 syncPaths 失败（脚本或配置有问题），拒绝取件"; exit 1; }
          if [ -z "$paths" ]; then
            echo "❌ --print-sync-paths 没有输出，拒绝取件"
            exit 1
          fi
          keep=""
          for p in $paths; do
            if [ -n "$(git ls-tree -r --name-only FETCH_HEAD -- "$p")" ]; then keep="$keep $p"; fi
          done
          # keep 为空时绝不能执行无 pathspec 的 checkout：那不是"取件"，
          # 而会把 HEAD 切到 FETCH_HEAD，整棵树被上游版本覆盖。
          # set -- 展开为位置参数：0 个参数即为空，不依赖"只用空格拼接"这个细节。
          set -- $keep
          if [ $# -eq 0 ]; then
            echo "❌ 过滤后没有可取路径（FETCH_HEAD 未命中任何 syncPaths），拒绝 checkout"
            exit 1
          fi
          git checkout FETCH_HEAD -- "$@"
      - name: Restore files we own
        run: |
          # 取件是按目录取的，会连归我们所有的文件一起覆盖；用 HEAD 里的版本还原。
          # 还原前逐个断言这些路径都在 HEAD 里：有缺失就打印是哪个并退出，
          # 避免 git checkout 以 128 硬失败、错误信息不可读。
          owned="$(node tools/apply-ours.mjs --print-ours-owned)" \
            || { echo "❌ 读取 oursOwned 失败（脚本或配置有问题），拒绝还原"; exit 1; }
          # set -- 展开为位置参数：空输出或仅空白都表现为 0 个参数，绝不能无参数 checkout。
          set -- $owned
          if [ $# -eq 0 ]; then
            echo "❌ --print-ours-owned 没有输出任何路径，拒绝还原"
            exit 1
          fi
          for p in "$@"; do
            if [ -z "$(git ls-tree HEAD -- "$p")" ]; then
              echo "❌ oursOwned 路径不在 HEAD 中（未跟踪或已被删除）：$p"
              exit 1
            fi
          done
          git checkout HEAD -- "$@"
      - name: Re-apply our patch (identity + category)
        run: node tools/apply-ours.mjs
      - run: npm ci
      - name: Self-checks
        run: |
          node scripts/generate-readme.mjs
          for f in scripts/*.test.mjs; do node --test "$f"; done
          SKIP_PUBLISH_CHECKS=1 node scripts/build-site.mjs
      - name: Restore our READMEs before staging
        run: |
          # Self-checks 里的 generate-readme.mjs 会重写 README.md / README.zh.md；
          # 这两个文件不在取件范围内、归我们所有，先还原成 HEAD 里的我们的版本，
          # 下面那条「staged 变更里不得出现 README」的断言才不会把合法同步判红
          # （断言保留，作为护栏）。
          git checkout HEAD -- README.md README.zh.md
      - name: Stage and assert we never brought data or the CNAME
        run: |
          # 顺序说明：取件时上游文件已随 checkout 写入索引；git add -A 把工作树里的
          # 还原与删除同步进索引，索引才是最终要提交的内容，所以断言放在 add 之后。
          git add -A
          # 数据与自定义域名一律不许进来，必须显式断言，不能只在文档里说。
          # 上游若把自定义域名文件挪到别的位置也要拦住，所以三个位置都查
          # （removePaths 登记了同样三处，删除与断言互为兜底）。
          for c in CNAME site/CNAME site/assets/CNAME; do
            if git ls-files --error-unmatch "$c" >/dev/null 2>&1; then
              echo "❌ $c 被带进索引（上游的自定义域名）"; exit 1
            fi
          done
          # 上游往 site/assets/ 里塞的素材（字体、og 图等）我们不要；取件是 overlay、
          # 从不删文件，所以新素材会静静漏进 PR，必须拦 staged 中的新增文件。
          # 处置指引：上游新增素材触发这里时，报错会打印具体文件名，
          # 把这些文件登记进 tools/ours.config.json 的 removePaths 即可转绿。
          if [ -n "$(git diff --cached --name-status --diff-filter=A -- site/assets)" ]; then
            echo "❌ site/assets/ 下出现新增文件（上游素材不进本仓）"
            git diff --cached --name-status --diff-filter=A -- site/assets
            exit 1
          fi
          # 下面 data/、README 与上面的 CNAME、site/assets 这几条断言，在当前步骤集合下
          # 都不会触发：取件范围本就不含 data/，README 在 staging 前已从 HEAD 还原，
          # CNAME 与上游素材由 removePaths 先删。它们是冗余护栏，断言保留作回归保险；
          # 真正的防线是"取件范围本来就只含代码目录"这件事本身。
          if git diff --cached --name-only | grep -Eq '^(data/|README\.md|README\.zh\.md)'; then
            echo "❌ 变更里出现了 data/ 或 README，超出取件范围"; git diff --cached --name-only; exit 1
          fi
          echo "取件范围校验通过：没有 data/、README、CNAME、site/assets 新增"

      - name: Drop upstream workflow changes (the default token cannot push them)
        id: workflows
        run: |
          # GITHUB_TOKEN 是 GitHub Actions 这个 App 的安装令牌，GitHub 不向它开放 workflows 权限
          # （permissions: 的合法键里也没有这一项），所以推送任何触碰 .github/workflows/** 的分支
          # 都会被服务端拒收：refusing to allow a GitHub App to create or update workflow ...
          # without `workflows` permission。因此这些改动从本次提交里撤掉，只在 PR 正文里列出、
          # 由人工在本机合并——上游对 CI 的改动本来也该有人看一眼。
          changed="$(git diff --cached --name-only -- .github/workflows)"
          if [ -z "$changed" ]; then exit 0; fi
          for f in $changed; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git checkout HEAD -- "$f"              # 我们已有的：还原成 HEAD 版本
            else
              git rm -q --cached "$f"; rm -f "$f"    # 上游新增的：从索引与工作区移除
            fi
          done
          {
            echo "skipped<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::上游改动了这些工作流文件，已从本次 PR 剔除：$(echo $changed | tr '\n' ' ')"

      - name: Open a PR if anything changed
        env:
          # 显式用内置令牌：gh 的认证优先级是 GH_TOKEN > GITHUB_TOKEN > 已存凭据，
          # 写清楚可以排除"另有残留凭据被优先采用"这类分裂表现（checkout 用 github.token 推送）。
          GH_TOKEN: ${{ github.token }}
          SKIPPED: ${{ steps.workflows.outputs.skipped }}
        run: |
          empty=''
          if git diff --cached --quiet; then
            # 只有工作流改动时也要开 PR：那是唯一能把「需人工合并」的清单送出去的渠道，
            # 否则这些改动会被静默丢掉（这时提交是空提交）。
            if [ -z "$SKIPPED" ]; then
              echo "上游没有带来变化"
              exit 0
            fi
            empty=1
          fi

          body="自动同步 [awesome-dsh-plugin](https://github.com/awesome-dsh-plugin/awesome-dsh-plugin) 的代码/站点/脚本。

          - 取件范围：\`tools/ours.config.json\` 的 \`syncPaths\`（**不含** \`data/\`、\`README*.md\`）
          - 已重新应用我们的补丁：身份串 + \`wsl\` → \`phone\`（🕹️ 手机控制）
          - 已通过：上游单测、README 重新生成、站点构建"

          if [ -n "$SKIPPED" ]; then
            body="$body

          **上游还改动了这些工作流文件，已从本次同步中剔除**（默认 \`GITHUB_TOKEN\` 无权推送 \`.github/workflows/**\`，GitHub 不向它开放 \`workflows\` 权限）。请先在本机合并，再合本 PR：

          \`\`\`
          git fetch upstream main && git checkout FETCH_HEAD -- .github/workflows && node tools/apply-ours.mjs
          \`\`\`

          $SKIPPED"
          fi

          body="$body

          请人工过一眼上游这次改了什么再合。"

          branch="chore/upstream-sync-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          if [ -n "$empty" ]; then
            git commit --allow-empty -m "chore: 上游工作流有改动，需在本机合并（本次无其它变更）"
          else
            git commit -m "chore: 同步上游代码/站点/脚本（身份与分类补丁已重新应用）"
          fi
          git push -u origin "$branch"
          # 用 REST 建 PR（而不是 gh pr create 的 GraphQL mutation）：
          # GraphQL 对 App 令牌只回 "Resource not accessible by integration"，
          # 不告诉你缺什么；REST 会给出状态码与 X-Accepted-GitHub-Permissions 响应头，
          # 能直接区分「端点要什么权限」与「令牌实际有什么」。
          set +e
          out=$(gh api -i --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="chore: 同步上游代码/站点/脚本" \
            -f head="$branch" \
            -f base=main \
            -f body="$body" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::REST 建 PR 失败（rc=$rc）；响应头里的 X-Accepted-GitHub-Permissions 说明了该端点接受的权限"
            exit $rc
          fi
          printf '%s\n' "$out" | grep -o '"html_url": *"[^"]*"' | head -1
